[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trelis-eval"
version = "0.1.0"
description = "External eval harness for Trelis, over the public HTTP API (ADR-0001)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx"]

[project.scripts]
trelis-eval = "trelis_eval.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trelis_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes/pycodestyle defaults, plus import order, bugbear and pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
