# Full stack: `docker compose up --build` (or `make stack-up`), with trelis
# built from the Dockerfile. For day-to-day work, run only the dependencies
# (compose.dev.yaml, `make dev-up`) and Trelis on the host (`make dev`).
#
#   trelis       http://localhost:8080   (/healthz liveness, /readyz dependencies)
#   + everything in compose.dev.yaml (Postgres, Neo4j, Temporal and its UI)
#
# Credentials are development defaults; override them through a .env file
# next to this one (see .env.example).
#
# Every trelis route except the probes needs an API key. Create one with:
#   docker compose run --rm trelis admin principal create alice
#   docker compose run --rm trelis admin key create alice
# then send it as "Authorization: Bearer <key>", e.g. GET /me.

name: trelis

include:
  - compose.dev.yaml

services:
  trelis:
    # Named so CI can build it once with a cache (docker/bake-action) and
    # `up` reuses it instead of rebuilding.
    image: trelis:dev
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      temporal-namespace: { condition: service_completed_successfully }
    environment:
      TRELIS_POSTGRES_HOST: postgres
      TRELIS_POSTGRES_USER: ${POSTGRES_USER:-trelis}
      TRELIS_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trelis}
      TRELIS_NEO4J_HOST: neo4j
      TRELIS_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-trelis-dev}
      TRELIS_TEMPORAL_HOST: temporal
    ports: ["127.0.0.1:8080:8080"]
    restart: on-failure
