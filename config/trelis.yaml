# Trelis service configuration. Any key can be overridden by an environment
# variable: TRELIS_ + the key path in upper case, dots as underscores.
#   server.addr        -> TRELIS_SERVER_ADDR
#   postgres.password  -> TRELIS_POSTGRES_PASSWORD
# Defaults target the ports compose.yaml publishes on localhost.
server:
  addr: ":8080"
  # How long SIGTERM waits for in-flight requests before giving up.
  shutdown_timeout: 10s

postgres:
  host: localhost
  port: 5432
  dbname: trelis
  user: trelis
  password: trelis
  sslmode: disable

neo4j:
  host: localhost
  port: 7687
  user: neo4j
  password: trelis-dev

temporal:
  host: localhost
  port: 7233
  namespace: default

storage:
  # Uploaded files, relative to the working directory (compose mounts a
  # volume at /data/files and sets TRELIS_STORAGE_LOCAL_DIR).
  local_dir: data/files
  max_file_size_mb: 50

# Model roles. Each role points at its own OpenAI-compatible provider
# (base_url, model, api_key); a role left empty is unconfigured. Keep keys
# out of this file: set TRELIS_MODELS_<ROLE>_API_KEY instead.
# models:
#   chat:
#     protocol: openai-completions   # POST {base_url}/chat/completions
#     base_url: http://localhost:4000/v1
#     model: gpt-4o-mini
#   extraction:
#     base_url: https://openrouter.ai/api/v1
#     model: qwen/qwen3-32b
#   judge:                         # should differ from the chat model
