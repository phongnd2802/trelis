# Trelis service configuration. Any key can be overridden by an environment
# variable: TRELIS_ + the key path in upper case, dots as underscores.
#   server.addr        -> TRELIS_SERVER_ADDR
#   postgres.password  -> TRELIS_POSTGRES_PASSWORD
# Defaults target the ports compose.yaml publishes on localhost.

# development or production, overridden by TRELIS_ENV. It picks the logging
# defaults below; production sets it through the environment, not this file.
env: development

# Logging (ADR-0008). Every record goes to stdout and to a JSON file rotated
# by lumberjack. A key left out, or an empty level/format/path, follows env:
#   development: level debug, format console, add_source true, logs/trelis.log
#   production:  level info,  format json,    add_source false, /var/log/trelis/trelis.log
# The rotation settings are the same in both environments.
# log:
#   level: debug        # debug, info, warn or error
#   format: console     # console or json, for stdout only
#   add_source: true    # caller file and line
#   file:
#     enabled: true
#     path: logs/trelis.log
#     max_size_mb: 100
#     max_backups: 7
#     max_age_days: 28
#     compress: true

server:
  addr: ":8080"
  # How long SIGTERM waits for in-flight requests before giving up.
  shutdown_timeout: 10s
  # Serve the open Swagger UI at /swagger/index.html for manual API testing.
  # Production should set TRELIS_SERVER_SWAGGER=false.
  swagger: true

postgres:
  host: localhost
  port: 5432
  dbname: trelis
  user: trelis
  password: trelis
  sslmode: disable

neo4j:
  host: localhost
  port: 7687
  user: neo4j
  password: trelis-dev

temporal:
  host: localhost
  port: 7233
  namespace: default
  # The queue the ingest workflow and its activities run on; every Trelis
  # process serving these Documents must use the same one.
  task_queue: trelis-ingest
  # Model-calling activities (embedding for now) run on their own queue, so
  # the rate limit below covers model calls and not the rest of ingest. It
  # must differ from task_queue: the ingest worker has no model activities
  # registered, and the limit would otherwise throttle ordinary ingest.
  model_task_queue: trelis-models
  # The global limit on model-call activity starts per second across every
  # worker on model_task_queue, enforced by the Temporal server. One
  # embed-batch activity sends one embeddings request, apart from the
  # client's own retries on 429 or 5xx inside that attempt, so this is close
  # to a limit on embeddings requests.
  model_activities_per_second: 5

storage:
  max_file_size_mb: 50
  # Source Files live in one S3-compatible bucket (ADR-0006): silo from
  # compose.dev.yaml here; AWS S3, R2, Ceph or Garage in production (leave
  # endpoint empty for AWS). In production set create_bucket: false and the
  # secret through TRELIS_STORAGE_S3_SECRET_ACCESS_KEY.
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: trelis
    access_key_id: trelis
    secret_access_key: trelis-dev-secret
    create_bucket: true

# Chunking. A Chunk is the unit retrieval embeds and searches; with
# parent-child mode on, ingest also stores a wider Parent Chunk around
# consecutive Chunks as context, but only the Chunks are embedded.
# Strategy auto tries the headings, then the heuristic sections, then the
# recursive split; recursive always uses the recursive split alone.
chunking:
  strategy: auto
  # Runes per embedded Chunk, and the most runes repeated from the previous
  # Chunk. The overlap must be smaller than the size.
  chunk_size: 512
  chunk_overlap: 80
  # Store Parent Chunks around consecutive Chunks. With it off, only the
  # Chunks are stored. Turning it on does not re-ingest earlier Documents:
  # their Chunks keep a NULL parent_id, so a reader of Parent Chunks falls
  # back to the Chunk.
  parent_child: false
  # Runes per Parent Chunk, used only when parent_child is true. It must be
  # at least twice chunk_size.
  parent_chunk_size: 2048

# Reconciler. Every server process runs one pass just after start and then
# once per interval. A pass restarts the ingest workflow of a Document left
# pending because starting it failed (starting is not in the upload's
# transaction, ADR-0005) and deletes objects that outlived their Document row
# (ADR-0006). Every step is idempotent, so several replicas may run it at
# once.
reconciler:
  interval: 1m

# Model roles. Each role points at its own OpenAI-compatible provider
# (base_url, model, api_key); a role left empty is unconfigured. Keep keys
# out of this file: set TRELIS_MODELS_<ROLE>_API_KEY instead. For your own
# providers, set TRELIS_MODELS_<ROLE>_BASE_URL / _MODEL in .local/models.env
# (exported by `make dev`) rather than editing this file.
# models:
#   chat:
#     protocol: openai-completions   # POST {base_url}/chat/completions
#     # protocol: openai-responses   # POST {base_url}/responses instead
#     base_url: http://localhost:4000/v1
#     model: gpt-4o-mini
#   extraction:
#     base_url: https://openrouter.ai/api/v1
#     model: qwen/qwen3-32b
#   judge:                         # should differ from the chat model
#     base_url: https://api.openai.com/v1
#     model: gpt-4.1
#   embedding:                     # POST {base_url}/embeddings
#     base_url: https://api.openai.com/v1
#     model: text-embedding-3-small
#     batch_size: 64               # texts per request and per embed activity, at least 1
#   rerank:                        # POST {base_url}/rerank
#     base_url: https://api.jina.ai/v1
#     model: jina-reranker-v2-base-multilingual
