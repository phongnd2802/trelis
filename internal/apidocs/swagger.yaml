basePath: /
definitions:
  errors.ErrorCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    type: integer
    x-enum-varnames:
    - ErrBadRequest
    - ErrUnauthorized
    - ErrForbidden
    - ErrNotFound
    - ErrMethodNotAllowed
    - ErrConflict
    - ErrTooManyRequests
    - ErrInternalServer
    - ErrServiceUnavailable
    - ErrTimeout
    - ErrValidation
    - ErrRequestEntityTooLarge
  handler.DataResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  handler.DuplicateDocumentResponse:
    properties:
      code:
        enum:
        - duplicate_document
        type: string
      data:
        $ref: '#/definitions/types.Document'
      message:
        type: string
      success:
        example: false
        type: boolean
    type: object
  handler.ErrorBody:
    properties:
      code:
        $ref: '#/definitions/errors.ErrorCode'
      details: {}
      message:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
      success:
        type: boolean
    type: object
  handler.PageResponse:
    properties:
      data: {}
      page:
        type: integer
      page_size:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
  router.CheckStatus:
    properties:
      error:
        type: string
      status:
        type: string
    type: object
  router.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  router.HealthStatus:
    properties:
      status:
        type: string
    type: object
  router.ReadyStatus:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/router.CheckStatus'
        type: object
      status:
        type: string
    type: object
  types.AccessList:
    properties:
      groups:
        items:
          type: string
        type: array
      principals:
        items:
          type: string
        type: array
    type: object
  types.Document:
    properties:
      access_list:
        allOf:
        - $ref: '#/definitions/types.AccessList'
        description: |-
          AccessList is filled in only for the owner, so other readers do not
          learn who else can read the Document.
      created_at:
        description: Creation time of the Document
        type: string
      file_hash:
        description: 'File hash of the Document: hex SHA-256 of its content'
        type: string
      file_name:
        description: File name of the Document
        type: string
      file_size:
        description: File size of the Document in bytes
        type: integer
      file_type:
        description: 'File type of the Document: its lower-case extension'
        type: string
      id:
        description: Unique identifier of the Document
        type: string
      parse_error:
        description: |-
          ParseError is why the last parse failed; empty unless ParseStatus is
          failed. It names no file name or Document text.
        type: string
      parse_status:
        description: Parse status of the Document
        type: string
      title:
        description: Title of the Document; the file name at upload
        type: string
      updated_at:
        description: Last updated time of the Document
        type: string
    type: object
  types.Group:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  types.Principal:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.Group'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  types.RetrievalConfig:
    properties:
      rrf_k:
        description: |-
          RRFK is the Reciprocal Rank Fusion constant k; nil means the default.
          It only affects a request that runs more than one technique, so it is
          accepted and ignored for a single one.
        type: integer
      techniques:
        description: |-
          Techniques is the set of Retrieval Techniques to run, without
          duplicates. More than one makes the request a fusion: each runs over
          the readable Documents and their lists are combined with Reciprocal
          Rank Fusion.
        items:
          $ref: '#/definitions/types.RetrievalTechnique'
        type: array
    type: object
  types.RetrievalRequest:
    properties:
      query:
        description: Query is the question to find Chunks for.
        type: string
      retrieval_config:
        allOf:
        - $ref: '#/definitions/types.RetrievalConfig'
        description: |-
          RetrievalConfig is the combination of techniques to run; nil means
          dense alone.
      top_k:
        description: |-
          TopK is how many Chunks to return; nil means the default. An explicit
          0 is invalid, so a client that sends it learns it is out of range
          instead of silently getting the default.
        type: integer
    type: object
  types.RetrievalResult:
    properties:
      results:
        items:
          $ref: '#/definitions/types.RetrievedChunk'
        type: array
      trace:
        items:
          $ref: '#/definitions/types.TraceStep'
        type: array
    type: object
  types.RetrievalTechnique:
    enum:
    - dense
    - bm25
    - rrf
    type: string
    x-enum-varnames:
    - RetrievalTechniqueDense
    - RetrievalTechniqueBM25
    - RetrievalTechniqueRRF
  types.RetrievedChunk:
    properties:
      chunk_id:
        type: string
      content:
        type: string
      context_header:
        type: string
      document_id:
        type: string
      ranks:
        additionalProperties:
          type: integer
        type: object
      score:
        type: number
      scores:
        additionalProperties:
          format: float64
          type: number
        type: object
      seq:
        type: integer
    type: object
  types.TraceStep:
    properties:
      candidates:
        description: |-
          Candidates is how many Chunks the step returned: the search step's own
          matches, or the distinct Chunks a fuse step combined. It is a pointer so
          a step with no candidate count leaves the field out.
        type: integer
      duration_ms:
        description: DurationMS is how long the step took, in milliseconds.
        type: integer
      model:
        description: Model is the embedding model, on the step that called one.
        type: string
      step:
        description: Step names what ran, e.g. TraceStepEmbedQuery.
        type: string
      technique:
        allOf:
        - $ref: '#/definitions/types.RetrievalTechnique'
        description: |-
          Technique is the Retrieval Technique the step belongs to, or
          RetrievalTechniqueRRF on the fuse step.
    type: object
info:
  contact: {}
  description: HTTP API for uploading, reading and searching Documents. Every route
    except the probes needs an API key.
  title: Trelis API
  version: 0.1.0
paths:
  /documents:
    get:
      description: 'Returns one page of the Documents the caller can read, newest
        first, without Access Lists. A page or page_size of 0, or either left out,
        takes the default: page 1 and page_size 20.'
      parameters:
      - default: 1
        description: Page number, 1-based; 0 or absent means the default of 1
        in: query
        maximum: 1000000
        minimum: 0
        name: page
        type: integer
      - default: 20
        description: Page size; 0 or absent means the default of 20
        in: query
        maximum: 1000
        minimum: 0
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.PageResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/types.Document'
                  type: array
              type: object
        "400":
          description: Invalid page or page_size
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: List readable Documents
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      description: Uploads one file as a new Document. "principals" and "groups" each
        name a comma-separated list added to the Access List; the uploader is always
        on it. Answers 409 when the caller already uploaded the same content.
      parameters:
      - description: The file to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Comma-separated Principal names for the Access List
        in: formData
        name: principals
        type: string
      - description: Comma-separated Group names for the Access List
        in: formData
        name: groups
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Document'
              type: object
        "400":
          description: Malformed upload, unknown Principal or Group, or unsupported
            file type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "409":
          description: The caller already uploaded this content
          schema:
            $ref: '#/definitions/handler.DuplicateDocumentResponse'
        "413":
          description: File larger than storage.max_file_size_mb
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Upload a Document
      tags:
      - documents
  /documents/{id}:
    get:
      description: Returns the Document, or 404 when it does not exist or the caller
        cannot read it, so a Restricted Document's existence is not revealed. Only
        the owner sees its Access List.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Document'
              type: object
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get a Document
      tags:
      - documents
  /documents/{id}/file:
    get:
      description: Streams the file as an attachment, never rendered in the API's
        origin. The Content-Disposition header names it and Content-Length gives its
        size.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: The Source File
          schema:
            type: file
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Download a Document's Source File
      tags:
      - documents
  /healthz:
    get:
      description: Answers 200 while the process is serving requests, whatever its
        dependencies are.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.HealthStatus'
      summary: Liveness probe
      tags:
      - system
  /me:
    get:
      description: Returns the Principal the API key belongs to, with its Groups,
        as the bare Principal rather than the response envelope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.Principal'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get the calling Principal
      tags:
      - principals
  /readyz:
    get:
      description: Probes Postgres, object storage, Neo4j and Temporal concurrently.
        Answers 200 when all are up, 503 when any is down.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ReadyStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/router.ReadyStatus'
      summary: Readiness probe
      tags:
      - system
  /retrieve:
    post:
      consumes:
      - application/json
      description: Runs every Retrieval Technique named in retrieval_config (dense
        and/or bm25) over the Documents the caller can read. One technique answers
        in its own order with its own score; several run concurrently over max(top_k,
        50) candidates each and are fused with Reciprocal Rank Fusion, score = the
        sum of 1/(rrf_k + rank) over the lists that carry the Chunk, then cut to top_k
        with equal fused scores ordered by chunk_id. rrf_k defaults to 60 and must
        be between 1 and 1000; it has no effect with one technique. Every result carries
        the score and 1-based rank of each technique whose list carried it. A bm25
        request needs no embedding model. A caller who can read nothing gets 200 with
        an empty results list. Malformed JSON, unknown fields, invalid values, an
        unknown or duplicate technique and an out-of-range rrf_k are 400; a body over
        64 KiB is 413; without models.embedding, a dense request (alone or alongside
        bm25) is 503.
      parameters:
      - description: The query, how many Chunks to return, which Retrieval Techniques
          to run and the RRF constant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.RetrievalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.RetrievalResult'
              type: object
        "400":
          description: Body that is not one JSON object, an unknown field or wrong
            value type, a blank or too-long query, an out-of-range top_k or an invalid
            retrieval_config (an unknown or duplicate technique, or an rrf_k outside
            1..1000)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "413":
          description: Request body larger than 64 KiB
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: models.embedding is not configured, so a request naming dense
            is unavailable (bm25 alone still works)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Retrieve Chunks for a query
      tags:
      - retrieval
securityDefinitions:
  bearerAuth:
    description: Paste "Bearer <key>", with a key from `trelis admin key create <principal>`
      (`go run ./cmd/server admin key create <principal>` in dev).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
