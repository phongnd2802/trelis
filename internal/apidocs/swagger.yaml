basePath: /
definitions:
  errors.ErrorCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    - 1012
    - 1013
    type: integer
    x-enum-varnames:
    - ErrBadRequest
    - ErrUnauthorized
    - ErrForbidden
    - ErrNotFound
    - ErrMethodNotAllowed
    - ErrConflict
    - ErrTooManyRequests
    - ErrInternalServer
    - ErrServiceUnavailable
    - ErrTimeout
    - ErrValidation
    - ErrRequestEntityTooLarge
    - ErrModelProvider
    - ErrPreconditionFailed
  handler.ConversationCreated:
    properties:
      created_at:
        type: string
      id:
        type: string
    type: object
  handler.DataResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  handler.DuplicateDocumentResponse:
    properties:
      code:
        enum:
        - duplicate_document
        type: string
      data:
        $ref: '#/definitions/types.Document'
      message:
        type: string
      success:
        example: false
        type: boolean
    type: object
  handler.ErrorBody:
    properties:
      code:
        $ref: '#/definitions/errors.ErrorCode'
      details: {}
      message:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
      success:
        type: boolean
    type: object
  handler.PageResponse:
    properties:
      data: {}
      page:
        type: integer
      page_size:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
  router.CheckStatus:
    properties:
      error:
        type: string
      status:
        type: string
    type: object
  router.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  router.HealthStatus:
    properties:
      status:
        type: string
    type: object
  router.ReadyStatus:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/router.CheckStatus'
        type: object
      status:
        type: string
    type: object
  types.AccessList:
    properties:
      groups:
        items:
          type: string
        type: array
      principals:
        items:
          type: string
        type: array
    type: object
  types.AnswerDebug:
    properties:
      results:
        items:
          $ref: '#/definitions/types.RetrievedChunk'
        type: array
      trace:
        items:
          $ref: '#/definitions/types.TraceStep'
        type: array
      usage:
        allOf:
        - $ref: '#/definitions/types.TokenUsage'
        description: Usage is the chat call's token accounting; zeros when no call
          was made.
    type: object
  types.AnswerRequest:
    properties:
      conversation_id:
        description: |-
          ConversationID asks the answer to carry the Conversation's last turns
          into retrieval and to record this question and answer as its next turn;
          nil answers without history and records nothing. The Conversation must
          belong to the caller, and an unknown or foreign one is a 404 before any
          retrieval or model call.
        type: string
      debug:
        description: |-
          Debug asks the answer to carry the retrieved Chunks, the trace and the
          chat call's token usage; false leaves the debug object out entirely.
        type: boolean
      query:
        description: Query is the question to find Chunks for.
        type: string
      retrieval_config:
        allOf:
        - $ref: '#/definitions/types.RetrievalConfig'
        description: |-
          RetrievalConfig is the combination of techniques to run; nil means
          dense alone.
      top_k:
        description: |-
          TopK is how many Chunks to return; nil means the default. An explicit
          0 is invalid, so a client that sends it learns it is out of range
          instead of silently getting the default.
        type: integer
    type: object
  types.AnswerResult:
    properties:
      answer:
        type: string
      citations:
        description: 'Citations is never null: an answer with no source cites nothing.'
        items:
          $ref: '#/definitions/types.Citation'
        type: array
      debug:
        allOf:
        - $ref: '#/definitions/types.AnswerDebug'
        description: |-
          Debug is present only when the request set debug; nil leaves the key
          out.
      finish_reason:
        type: string
    type: object
  types.Chunk:
    properties:
      content:
        description: Content is the source text of the Chunk
        type: string
      context_header:
        description: |-
          ContextHeader is context that is not in the source at the offsets,
          such as a heading breadcrumb or a repeated table header
        type: string
      created_at:
        description: Creation time of the Chunk
        type: string
      document_id:
        description: Document this Chunk belongs to
        type: string
      end_offset:
        description: EndOffset is the rune just past the last one in Content
        type: integer
      id:
        description: Unique identifier of the Chunk
        type: string
      seq:
        description: Seq orders the Chunks of one Document, starting at 0
        type: integer
      start_offset:
        description: StartOffset is the first rune of the Document's Markdown in Content
        type: integer
    type: object
  types.Citation:
    properties:
      chunk_id:
        description: ChunkID is the retrieved Chunk the marker stands for.
        type: string
      document_id:
        description: DocumentID is the Document that Chunk belongs to.
        type: string
      marker:
        description: Marker is the source number the answer text cites, e.g. 2 for
          [2].
        type: integer
    type: object
  types.Conversation:
    properties:
      created_at:
        description: CreatedAt is when the Conversation was created.
        type: string
      id:
        description: ID identifies the Conversation on every route that reads it.
        type: string
      turns:
        description: Turns are its turns in Seq order; it is never null in a read
          answer.
        items:
          $ref: '#/definitions/types.ConversationTurn'
        type: array
    type: object
  types.ConversationTurn:
    properties:
      answer:
        description: Answer is the cleaned answer text, exactly as the answer returned
          it.
        type: string
      created_at:
        description: CreatedAt is when the turn was recorded.
        type: string
      question:
        description: Question is the raw question the caller asked.
        type: string
      rewritten_query:
        description: |-
          RewrittenQuery is the standalone query a query rewrite produced and
          retrieval searched with, or nil when no rewrite ran. It is the query
          actually used, so a rewrite that fell back to the raw question stores
          that.
        type: string
      seq:
        description: Seq is the Conversation's own sequence number, starting at 1.
        type: integer
      withheld:
        description: |-
          Withheld is true when any source Document is no longer readable to the
          caller: Answer is empty, RewrittenQuery is nil, and only Seq, Question
          and CreatedAt are shown.
        type: boolean
    type: object
  types.Document:
    properties:
      access_list:
        allOf:
        - $ref: '#/definitions/types.AccessList'
        description: |-
          AccessList is filled in only for the owner, so other readers do not
          learn who else can read the Document.
      created_at:
        description: Creation time of the Document
        type: string
      file_hash:
        description: 'File hash of the Document: hex SHA-256 of its content'
        type: string
      file_name:
        description: File name of the Document
        type: string
      file_size:
        description: File size of the Document in bytes
        type: integer
      file_type:
        description: 'File type of the Document: its lower-case extension'
        type: string
      id:
        description: Unique identifier of the Document
        type: string
      parse_error:
        description: |-
          ParseError is why the last parse failed; empty unless ParseStatus is
          failed. It names no file name or Document text.
        type: string
      parse_status:
        description: Parse status of the Document
        type: string
      title:
        description: Title of the Document; the file name at upload
        type: string
      updated_at:
        description: Last updated time of the Document
        type: string
    type: object
  types.Group:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  types.ParentExpansion:
    properties:
      chunk_id:
        description: ChunkID is the result's chunk_id, the best-ranked matched Chunk.
        type: string
      matched_chunk_ids:
        description: |-
          MatchedChunkIDs is every matched Chunk that collapsed into the result,
          in rank order; the first is ChunkID.
        items:
          type: string
        type: array
      parent_chunk_id:
        description: |-
          ParentChunkID is the Parent Chunk that supplied the content; nil when
          the result is a Chunk with no Parent Chunk.
        type: string
    type: object
  types.Principal:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.Group'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  types.RetrievalConfig:
    properties:
      rerank_candidates:
        description: |-
          RerankCandidates is how many Chunks the first stage hands to the
          reranker; nil means the default. It is accepted and ignored when the
          list does not name the rerank technique.
        type: integer
      rrf_k:
        description: |-
          RRFK is the Reciprocal Rank Fusion constant k; nil means the default.
          It only affects a request that runs more than one technique, so it is
          accepted and ignored for a single one.
        type: integer
      techniques:
        description: |-
          Techniques is the set of Retrieval Techniques to run, without
          duplicates. More than one candidate technique makes the request a
          fusion: each runs over the readable Documents and their lists are
          combined with Reciprocal Rank Fusion. query_rewrite rewrites the
          question first when the request carries Conversation History; rerank
          reorders whatever the candidate techniques found; parent_child then
          replaces the ordered Chunks with their Parent Chunks.
        items:
          $ref: '#/definitions/types.RetrievalTechnique'
        type: array
    type: object
  types.RetrievalRequest:
    properties:
      query:
        description: Query is the question to find Chunks for.
        type: string
      retrieval_config:
        allOf:
        - $ref: '#/definitions/types.RetrievalConfig'
        description: |-
          RetrievalConfig is the combination of techniques to run; nil means
          dense alone.
      top_k:
        description: |-
          TopK is how many Chunks to return; nil means the default. An explicit
          0 is invalid, so a client that sends it learns it is out of range
          instead of silently getting the default.
        type: integer
    type: object
  types.RetrievalResult:
    properties:
      results:
        items:
          $ref: '#/definitions/types.RetrievedChunk'
        type: array
      trace:
        items:
          $ref: '#/definitions/types.TraceStep'
        type: array
    type: object
  types.RetrievalTechnique:
    enum:
    - dense
    - bm25
    - query_rewrite
    - rerank
    - parent_child
    - rrf
    type: string
    x-enum-varnames:
    - RetrievalTechniqueDense
    - RetrievalTechniqueBM25
    - RetrievalTechniqueQueryRewrite
    - RetrievalTechniqueRerank
    - RetrievalTechniqueParentChild
    - RetrievalTechniqueRRF
  types.RetrievedChunk:
    properties:
      chunk_id:
        description: |-
          ChunkID, DocumentID and Seq are the best-ranked matched Chunk's, so a
          citation or GET /chunks/{id} still reaches a real Chunk.
        type: string
      content:
        description: |-
          Content and ContextHeader are the Parent Chunk's when the request
          expanded to parents, else the Chunk's own.
        type: string
      context_header:
        type: string
      document_id:
        type: string
      parent_chunk_id:
        description: |-
          ParentChunkID is the Parent Chunk the content came from; it is absent
          when the Chunk stands alone.
        type: string
      ranks:
        additionalProperties:
          type: integer
        type: object
      score:
        type: number
      scores:
        additionalProperties:
          format: float64
          type: number
        type: object
      seq:
        type: integer
    type: object
  types.TokenUsage:
    properties:
      completion_tokens:
        type: integer
      prompt_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  types.TraceStep:
    properties:
      candidates:
        description: |-
          Candidate count fields below keep their pointer shape so a step that
          has no count leaves the field out.

          Candidates is how many Chunks the step returned: the search step's own
          matches, the distinct Chunks a fuse step combined, the pool size sent
          to the reranker, or the results the expand_parents step produced before
          the cut.
        type: integer
      duration_ms:
        description: DurationMS is how long the step took, in milliseconds.
        type: integer
      expanded:
        description: |-
          Expanded says which Chunks collapsed into which result, one entry per
          returned result in result order, on the expand_parents step. It is a
          pointer so an expand step with no results still answers expanded: []
          while every other step leaves the field out.
        items:
          $ref: '#/definitions/types.ParentExpansion'
        type: array
      model:
        description: |-
          Model is the embedding, rerank or chat model, on the step that called
          one.
        type: string
      rewritten_query:
        description: |-
          RewrittenQuery is the query the techniques searched with, on the
          rewrite_query step: the model's reply, or the raw question when the
          reply was blank or too long.
        type: string
      step:
        description: Step names what ran, e.g. TraceStepEmbedQuery.
        type: string
      technique:
        allOf:
        - $ref: '#/definitions/types.RetrievalTechnique'
        description: |-
          Technique is the Retrieval Technique the step belongs to, or
          RetrievalTechniqueRRF on the fuse step.
      usage:
        allOf:
        - $ref: '#/definitions/types.TokenUsage'
        description: Usage is the chat call's token accounting on the rewrite_query
          step.
    type: object
info:
  contact: {}
  description: HTTP API for uploading, reading, searching and questioning Documents.
    Every route except the probes needs an API key.
  title: Trelis API
  version: 0.1.0
paths:
  /answer:
    post:
      consumes:
      - application/json
      description: 'Retrieves the Documents the caller can read, then asks models.chat
        for one answer that cites the retrieved Chunks. Sources are numbered [1]..[n]
        in retrieval order; each claim is cited with its source numbers in square
        brackets, the answer text keeps the valid markers, and citations lists each
        cited source once in order of first appearance. A marker outside 1..n is removed
        from the text and never cited; a marker inside Markdown code or a Markdown
        link is left untouched and never cited. When retrieval finds nothing the answer
        is a fixed sentence in the question''s language and no chat call is made.
        debug adds the retrieved Chunks (exactly as POST /retrieve answers them),
        the trace with a final generate step, and the token usage of every model call,
        including a query rewrite. With conversation_id, the Conversation''s last
        five turns are carried into retrieval and this question and the cleaned answer
        are recorded as its next turn; naming query_rewrite then rewrites a follow-up
        into one standalone query before any technique searches, and the raw question
        is still what the no-source answer and the recorded turn keep. The Conversation
        must belong to the caller: an unknown or foreign id is 404 before any retrieval
        or model call. Without conversation_id the answer has no history and records
        nothing. With Accept: text/event-stream the answer streams Answer Events as
        Server-Sent Events instead: id is the per-answer seq and event is started
        {"answer_id"}, token {"text"} per model delta, citation {"marker","chunk_id","document_id"}
        after the text, then done {"answer","finish_reason","debug"?}; an error {"message"}
        replaces done when generation fails or the turn cannot be recorded, and both
        are terminal. The chat stream is opened before the SSE response, so a provider
        rejection is the same JSON 502. A dropped client resumes at GET /answers/{answer_id}/events
        with Last-Event-ID. Malformed JSON, unknown fields, invalid values and the
        retrieval rules are 400; a body over 64 KiB is 413; without models.chat the
        route answers 503 before any retrieval, and retrieval''s own 503 (models.embedding
        for dense, models.rerank for rerank, models.chat for query rewrite) passes
        through; a model provider''s rejection of a retrieval or opening the chat
        stream (its credentials, credit, permission or rate limit) is 502 and names
        the model role in its message, and any other model failure is a generic 500.
        Every one of these failures answers the JSON error before the SSE headers.'
      parameters:
      - description: The query, how many Chunks to retrieve, which Retrieval Techniques
          to run, the Conversation to continue and whether to return the debug object
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.AnswerRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: 'The JSON answer when Accept does not ask for text/event-stream;
            otherwise Server-Sent Events: started, token..., citation..., then done
            or error'
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.AnswerResult'
              type: object
        "400":
          description: Body that is not one JSON object, an unknown field or wrong
            value type, a blank or too-long query, an out-of-range top_k or an invalid
            retrieval_config
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: The conversation_id is unknown or belongs to another Principal;
            answered before any retrieval or model call
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request body larger than 64 KiB
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error, including a Conversation turn that could
            not be recorded; a failed API key check answers the router's error body
            instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: A model provider rejected the call because of its credentials,
            credit, permission or rate limit (an embedding, rerank or chat status
            401, 402, 403 or 429); the message names the model role, never the provider's
            body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: models.chat is not configured, or retrieval is unavailable
            (models.embedding for dense, models.rerank for rerank, models.chat for
            query rewrite)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Answer a question from readable Documents
      tags:
      - answering
  /answers/{answer_id}/events:
    get:
      description: Streams a Pipeline Answer's Answer Events as Server-Sent Events,
        starting after Last-Event-ID. Each frame's id is the event's seq within the
        answer and event is started, token, citation, done or error. started carries
        {"answer_id"}, token {"text"} (the raw model delta), citation {"marker","chunk_id","document_id"}
        once per cited source in first-appearance order, and done {"answer","finish_reason","debug"?}
        or error {"message"} ends the stream. Only the Principal who asked for the
        answer may resume it; any other caller gets the same 404 as for an unknown
        or expired answer ID.
      parameters:
      - description: Answer ID
        format: uuid
        in: path
        name: answer_id
        required: true
        type: string
      - description: Seq of the last event the client saw; only later events are sent
        in: header
        name: Last-Event-ID
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-Sent Events, one frame per answer event; the stream
            ends after done or error
          schema:
            type: string
        "400":
          description: Invalid Last-Event-ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No answer stream with that ID, it expired, or it belongs to
            another Principal
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Resume a streamed Pipeline Answer
      tags:
      - answering
  /chunks/{id}:
    get:
      description: Returns the Chunk, without its embedding, when the caller can read
        its Document. A Chunk that does not exist and one whose Document the caller
        cannot read answer the same 404, so a Restricted Document's existence is not
        revealed.
      parameters:
      - description: Chunk ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Chunk'
              type: object
        "400":
          description: ID that is not a UUID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No readable Chunk with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get a Chunk
      tags:
      - chunks
  /conversations:
    post:
      consumes:
      - application/json
      description: Creates a Conversation owned by the caller for a series of follow-up
        questions. The body is empty or an empty JSON object. Ask a question in it
        with POST /answer and its conversation_id; the answer carries the last five
        turns into retrieval and records the new turn.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/handler.ConversationCreated'
              type: object
        "400":
          description: A body that is not an empty JSON object
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "413":
          description: Request body larger than 64 KiB
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Create a Conversation
      tags:
      - conversations
  /conversations/{id}:
    get:
      description: 'Returns the caller''s Conversation with its turns in seq order:
        each turn''s seq, raw question, rewritten_query when a query rewrite ran,
        cleaned answer and created_at. turns is [] when the Conversation has no turns,
        never null. A turn whose source Documents are no longer all readable to the
        caller keeps its seq, question and created_at, answers answer:"" with withheld:true,
        and drops rewritten_query; source_document_ids is never exposed. A Conversation
        the caller does not own, an unknown id and a malformed id all answer the same
        404 body.'
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Conversation'
              type: object
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Conversation with that id belongs to the caller; a malformed
            id answers the same body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Read a Conversation and its turns
      tags:
      - conversations
  /documents:
    get:
      description: 'Returns one page of the Documents the caller can read, newest
        first, without Access Lists. A page or page_size of 0, or either left out,
        takes the default: page 1 and page_size 20.'
      parameters:
      - default: 1
        description: Page number, 1-based; 0 or absent means the default of 1
        in: query
        maximum: 1000000
        minimum: 0
        name: page
        type: integer
      - default: 20
        description: Page size; 0 or absent means the default of 20
        in: query
        maximum: 1000
        minimum: 0
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.PageResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/types.Document'
                  type: array
              type: object
        "400":
          description: Invalid page or page_size
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: List readable Documents
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      description: Uploads one file as a new Document. "principals" and "groups" each
        name a comma-separated list added to the Access List; the uploader is always
        on it. Answers 409 when the caller already uploaded the same content.
      parameters:
      - description: The file to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Comma-separated Principal names for the Access List
        in: formData
        name: principals
        type: string
      - description: Comma-separated Group names for the Access List
        in: formData
        name: groups
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Document'
              type: object
        "400":
          description: Malformed upload, unknown Principal or Group, or unsupported
            file type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "409":
          description: The caller already uploaded this content
          schema:
            $ref: '#/definitions/handler.DuplicateDocumentResponse'
        "413":
          description: File larger than storage.max_file_size_mb
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Upload a Document
      tags:
      - documents
  /documents/{id}:
    delete:
      description: Only the Document's owner may delete it. Removes the Document and
        everything derived from it, cancels its ingest and, once the row is gone,
        removes every object it stored. A reader who is not the owner gets 403; a
        caller who cannot read the Document gets 404, the same as for one that does
        not exist.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid Document ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "403":
          description: The caller can read the Document but is not its owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Delete a Document
      tags:
      - documents
    get:
      description: Returns the Document, or 404 when it does not exist or the caller
        cannot read it, so a Restricted Document's existence is not revealed. Only
        the owner sees its Access List.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Document'
              type: object
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get a Document
      tags:
      - documents
  /documents/{id}/events:
    get:
      description: Streams the Document's Ingest Events as Server-Sent Events while
        the caller can read it. Each frame's id is the event's seq within the Document,
        event is parse_started, parse_finished, embed_batch_finished, upload_replaced,
        completed or failed, and data is {"document_id","upload_id","type","detail","created_at"}.
        detail is {"attempt"} for parse_started, {"chunks"} for parse_finished, {"from","to","chunks"}
        for embed_batch_finished, {"upload_id"} for upload_replaced, {"reason"} for
        failed, and {} for completed. Reconnecting with Last-Event-ID replays the
        events after that seq, then carries on live. After a re-upload the stream
        passes an older upload's completed or failed event, then its upload_replaced
        event, and ends at the current upload's completed or failed. It also ends
        when the Document is gone or no longer readable, when the client disconnects,
        when the server shuts down, or after 30 minutes so a Document stuck in processing
        cannot hold it forever; reconnecting with Last-Event-ID loses nothing.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Per-Document seq of the last event the client saw; only later
          events are sent
        in: header
        name: Last-Event-ID
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-Sent Events, one frame per Ingest Event; the stream
            ends after the current upload's completed or failed, or after 30 minutes
          schema:
            type: string
        "400":
          description: Invalid Document ID or Last-Event-ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Stream a Document's ingest progress
      tags:
      - documents
  /documents/{id}/file:
    get:
      description: Streams the file as an attachment, never rendered in the API's
        origin. The Content-Disposition header names it and Content-Length gives its
        size.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: The Source File
          schema:
            type: file
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Download a Document's Source File
      tags:
      - documents
    put:
      consumes:
      - multipart/form-data
      description: Replaces the Document's Source File with the uploaded one, under
        a new upload ID, and starts ingesting the new upload. The Access List is unchanged.
        Only the owner may replace it; the access and owner checks run before the
        body is read. Answers 409 with the earlier Document when the caller already
        has a Document with the same content. A concurrent re-upload answers 412;
        a concurrent delete answers 404. The old Chunks are removed before this returns.
      parameters:
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: The new Source File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.Document'
              type: object
        "400":
          description: Malformed upload, invalid Document ID or unsupported file type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "403":
          description: The caller can read the Document but is not its owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: No readable Document with that ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: The caller already has a Document with this content
          schema:
            $ref: '#/definitions/handler.DuplicateDocumentResponse'
        "412":
          description: A concurrent re-upload changed the Document; retry
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: File larger than storage.max_file_size_mb
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Replace a Document's Source File
      tags:
      - documents
  /healthz:
    get:
      description: Answers 200 while the process is serving requests, whatever its
        dependencies are.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.HealthStatus'
      summary: Liveness probe
      tags:
      - system
  /me:
    get:
      description: Returns the Principal the API key belongs to, with its Groups,
        as the bare Principal rather than the response envelope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.Principal'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get the calling Principal
      tags:
      - principals
  /readyz:
    get:
      description: Probes Postgres, object storage, Neo4j and Temporal concurrently.
        Answers 200 when all are up, 503 when any is down.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ReadyStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/router.ReadyStatus'
      summary: Readiness probe
      tags:
      - system
  /retrieve:
    post:
      consumes:
      - application/json
      description: 'Runs every candidate Retrieval Technique named in retrieval_config
        (dense and/or bm25) over the Documents the caller can read. One technique
        answers in its own order with its own score; several run concurrently over
        max(top_k, 50) candidates each and are fused with Reciprocal Rank Fusion,
        score = the sum of 1/(rrf_k + rank) over the lists that carry the Chunk, then
        cut to top_k with equal fused scores ordered by chunk_id. rrf_k defaults to
        60 and must be between 1 and 1000; it has no effect with one technique. Naming
        rerank adds a second stage: the candidate pool (the single list or the fused
        list, cut to rerank_candidates) is scored once by the rerank model, ordered
        by that score with ties by chunk_id; rerank cannot run alone. rerank_candidates
        defaults to 50, must be between 1 and 100 and at least top_k, and has no effect
        without rerank. Naming parent_child adds a final stage: each matched Chunk
        is replaced by its Parent Chunk, several matched Chunks of one Parent Chunk
        collapse into the position of the best-ranked matched Chunk, and a Chunk with
        no Parent Chunk stands alone; chunk_id, document_id, seq, score, scores and
        ranks stay the best-ranked matched Chunk''s, content and context_header become
        the Parent Chunk''s, and parent_chunk_id names it (absent for a standalone
        Chunk). Without rerank parent_child searches max(top_k, 50) deep; with rerank
        the pool stays rerank_candidates and the cut to top_k happens after the collapse.
        Naming query_rewrite adds a first stage: when the request carries Conversation
        History, which POST /answer fills, the chat role rewrites the latest question
        into one standalone query and every technique, and rerank, searches with it;
        the trace then starts with rewrite_query carrying rewritten_query and the
        call''s usage. Without history no model call is made, so POST /retrieve accepts
        query_rewrite and never calls a model. query_rewrite cannot run alone. Every
        result carries the score and 1-based rank of each technique whose list carried
        it, plus the rerank score and rank when it ran. A bm25 request needs no embedding
        model. A caller who can read nothing gets 200 with an empty results list.
        Malformed JSON, unknown fields, invalid values, an unknown or duplicate technique,
        a config whose only techniques are stages (query_rewrite, rerank, parent_child),
        an out-of-range rrf_k or rerank_candidates are 400; a body over 64 KiB is
        413; without models.embedding, a dense request is 503, without models.rerank
        a request naming rerank is 503, and without models.chat a request naming query_rewrite
        is 503. A model provider''s rejection of the call (its credentials, credit,
        permission or rate limit) is 502 and names the model role in its message;
        any other model failure is a generic 500.'
      parameters:
      - description: The query, how many Chunks to return, which Retrieval Techniques
          to run (dense, bm25, query_rewrite, rerank, parent_child), the RRF constant
          and the rerank candidate pool
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.RetrievalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/types.RetrievalResult'
              type: object
        "400":
          description: Body that is not one JSON object, an unknown field or wrong
            value type, a blank or too-long query, an out-of-range top_k or an invalid
            retrieval_config (an unknown or duplicate technique, only stage techniques
            such as query_rewrite, rerank or parent_child, an rrf_k outside 1..1000,
            or a rerank_candidates outside 1..100 or below top_k)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "413":
          description: Request body larger than 64 KiB
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error; a failed API key check answers the router's
            error body instead
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: A model provider rejected the call because of its credentials,
            credit, permission or rate limit (an embedding or rerank status 401, 402,
            403 or 429); the message names the model role, never the provider's body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: models.embedding is not configured so dense cannot run, models.rerank
            is not configured so rerank cannot run, or models.chat is not configured
            so query_rewrite cannot run (bm25 alone still works)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Retrieve Chunks for a query
      tags:
      - retrieval
securityDefinitions:
  bearerAuth:
    description: Paste "Bearer <key>", with a key from `trelis admin key create <principal>`
      (`go run ./cmd/server admin key create <principal>` in dev).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
