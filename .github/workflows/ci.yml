name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Default build: no Rust, the anydoc engine compiles as a stub.
  lite:
    runs-on: ubuntu-latest
    # Same image as compose.yaml, so migration tests see pg_search and pgvector.
    services:
      postgres:
        image: paradedb/paradedb:0.27.1-pg18
        env:
          POSTGRES_USER: trelis
          POSTGRES_PASSWORD: trelis
          POSTGRES_DB: trelis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U trelis -d trelis"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TRELIS_TEST_POSTGRES_DSN: postgres://trelis:trelis@localhost:5432/trelis?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint (version pinned in Makefile)
        run: make tools
      - name: Lint (golangci-lint + gofmt)
        run: make lint
      - name: Swagger spec is up to date
        run: |
          make swagger
          if [ -n "$(git status --porcelain -- internal/apidocs)" ]; then
            echo "internal/apidocs is stale; commit the output of make swagger" >&2
            git status --porcelain -- internal/apidocs
            exit 1
          fi
      - name: Vet
        run: make vet-lite
      - name: Test
        run: make test
      - name: Build
        run: make build-lite

  # anydoc build: links the Rust static archive built from third_party/anydoc-go.
  linked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/anydoc-go
      - name: Install golangci-lint (version pinned in Makefile)
        run: make tools
      - name: Build anydoc archive
        run: make anydoc-lib
      - name: Lint
        run: make lint-linked
      - name: Vet
        run: make vet-linked
      - name: Test
        run: make test-linked
      - name: Integration tests with the linked engine
        run: make test-integration-linked
      - name: Build
        run: make build

  # The HTTP API against Postgres, Neo4j and S3 in testcontainers plus a
  # Temporal dev server, with the fake model provider (internal/integration).
  # The runner's Docker hosts the containers.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: make test-integration

  # The whole compose stack on a fresh runner (the clean-checkout case), then
  # again over the same volumes to prove every init step is idempotent.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layers (including the Rust stage that builds the anydoc archive) are
      # cached in the GitHub Actions cache, so an unchanged third_party/ skips
      # the Rust build. RUN --mount=type=cache contents are not exported.
      - name: Build trelis image (GitHub Actions cache)
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: trelis
          load: true
          set: |
            trelis.cache-from=type=gha,scope=trelis
            trelis.cache-to=type=gha,scope=trelis,mode=max
      - name: First boot (empty volumes)
        run: BUILD=0 WAIT_TIMEOUT=600 make stack-up
      - name: Ready
        run: curl -fsS --retry 15 --retry-delay 2 --retry-all-errors localhost:8080/readyz
      - name: Second boot (same volumes)
        run: |
          docker compose down
          BUILD=0 WAIT_TIMEOUT=300 make stack-up
      - name: Ready again, no migration re-applied
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors localhost:8080/readyz
          docker compose logs --no-color trelis | grep 'postgres migrated' | tail -1 | tee /dev/stderr | grep -q '"applied":0'
