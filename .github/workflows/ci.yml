name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Default build: no Rust, the anydoc engine compiles as a stub.
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # anydoc build: links the Rust static archive built from third_party/anydoc-go.
  linked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/anydoc-go
      - name: Build anydoc archive
        run: make anydoc-lib
      - name: Build
        run: CGO_ENABLED=1 go build -tags anydoc ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet -tags anydoc ./...
      - name: Test
        run: CGO_ENABLED=1 go test -tags anydoc ./...
