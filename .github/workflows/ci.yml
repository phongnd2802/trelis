name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  # Default build: no Rust, the anydoc engine compiles as a stub.
  lite:
    runs-on: ubuntu-latest
    # Same image as compose.yaml, so migration tests see pg_search and pgvector.
    services:
      postgres:
        image: paradedb/paradedb:0.27.1-pg18
        env:
          POSTGRES_USER: trelis
          POSTGRES_PASSWORD: trelis
          POSTGRES_DB: trelis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U trelis -d trelis"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TRELIS_TEST_POSTGRES_DSN: postgres://trelis:trelis@localhost:5432/trelis?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: Lint (golangci-lint + gofmt)
        run: make lint
      - name: Vet
        run: make vet-lite
      - name: Test
        run: make test
      - name: Build
        run: make build-lite

  # anydoc build: links the Rust static archive built from third_party/anydoc-go.
  linked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/anydoc-go
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: Build anydoc archive
        run: make anydoc-lib
      - name: Lint
        run: make lint-linked
      - name: Vet
        run: make vet-linked
      - name: Test
        run: make test-linked
      - name: Build
        run: make build
