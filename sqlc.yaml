# sqlc generates type-safe query code from the goose migrations (schema) and
# the queries in internal/db/queries, one .sql file per module. Regenerate
# with `make sqlc`; the output in internal/db/sqlc is committed.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        # Querier is what db.Store hands repositories (ADR-0007).
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # pgvector's vector as its text form, the way the queries pass it,
          # rather than pulling in pgvector-go for a column no query scans.
          - column: chunks.embedding
            go_type: string
