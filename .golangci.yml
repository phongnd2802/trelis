version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: log/slog
              desc: library code logs through internal/logger (zap)
            - pkg: log
              desc: library code logs through internal/logger (zap)
        # ADR-0007 / CODING_STANDARDS Layers: services and handlers reach the
        # model clients through contracts in internal/types/interfaces;
        # cmd/server wires the concrete client in.
        layers:
          files:
            - "**/internal/application/**"
            - "**/internal/handler/**"
          deny:
            - pkg: github.com/phongnd2802/trelis/internal/models
              desc: depend on the contract in internal/types/interfaces; cmd/server wires the model client
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: library code logs through internal/logger (zap); only cmd/ prints to stdout
        - pattern: ^zap\.(L|S)$
          msg: log through logger.Ctx(ctx) so the record keeps its request fields; zap.L() only where no ctx exists (mark it //nolint:forbidigo with the reason)
  exclusions:
    rules:
      - path: ^cmd/
        linters: [forbidigo]
        text: fmt\.Print
      # The logger package itself owns the global fallback.
      - path: ^internal/logger/
        linters: [forbidigo]
        text: zap\.
      - path: _test\.go$
        linters: [forbidigo, depguard]

formatters:
  enable:
    - gofmt
